#
# Hypothetical variant of b300_sxm.yaml: num_gpus_per_node raised from 8 to
# 288 so the whole 288-GPU domain is treated as NVLink-local. Identical to
# b300_sxm_nvl72.yaml in every field except node.num_gpus_per_node -- the
# two overrides must stay byte-identical apart from that one field, since
# the NVL72-vs-NVL288 comparison depends on isolating exactly that variable.

data_dir: /home/jding/Documents/aisimulate/python/aisimulate/src/aisimulate_core/systems/data/b300_sxm # absolute path -- reuse b300_sxm's perf tables verbatim

gpu:
  fp32_flops: 75000000000000
  mem_bw: 7750000000000
  mem_bw_empirical_scaling_factor: 0.8
  mem_empirical_constant_latency: 0.000003
  mem_capacity: 288400343040
  bfloat16_tc_flops: 2250000000000000
  int8_tc_flops: 153500000000000
  fp8_tc_flops: 4500000000000000
  fp4_tc_flops: 14000000000000000
  power: 1100
  sm_version: 103

node:
  num_gpus_per_node: 288  # override: entire 288-GPU domain treated as scale-up
  inter_node_bw: 100000000000
  intra_node_bw: 900000000000
  pcie_bw: 128000000000
  p2p_latency: 0.00001

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27'
