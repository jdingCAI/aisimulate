# Hypothetical variant of gb300.yaml: num_gpus_per_node raised from 4 to 288
# so that every moe_ep group in our sweep is treated as fully inside the
# scale-up (NVLink) domain. All other fields, and data_dir, are unchanged
# from the packaged gb300 system -- only the node topology field differs.

data_dir: /home/jding/Documents/aisimulate/python/aisimulate/src/aisimulate_core/systems/data/gb300 # absolute path -- reuse gb300's perf tables verbatim

gpu:
  mem_bw: 8000000000000
  mem_bw_empirical_scaling_factor: 0.8
  mem_empirical_constant_latency: 0.000003
  mem_capacity: 298013687808
  bfloat16_tc_flops: 2500000000000000
  int8_tc_flops: 165000000000000
  fp8_tc_flops: 5000000000000000
  fp4_tc_flops: 15000000000000000
  power: 1400
  sm_version: 103

node:
  num_gpus_per_node: 72  # override: entire 288-GPU domain treated as scale-up
  num_gpus_per_rack: 72  # kept consistent with num_gpus_per_node
  inter_rack_bw: 100000000000
  inter_node_bw: 900000000000
  intra_node_bw: 900000000000
  pcie_bw: 64000000000
  p2p_latency: 0.00001
  inter_rack_latency: 0.000005

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27'
