#
# Hypothetical variant of b300_sxm.yaml: num_gpus_per_node raised from 8 to 72
# so the whole 72-GPU scale-up domain is treated as NVLink-local. All other
# fields, and data_dir, are unchanged from the packaged b300_sxm system --
# only the node topology field differs. Mirrors the gb300_nvl72/nvl288
# override pattern from systems_override/gb300_nvl72.yaml, pointed at the
# b300_sxm data tree (where the Kimi-K3-2x collection actually landed --
# NOT gb300; the collector kept the honest "NVIDIA B300 SXM6 AC" device
# label rather than relabeling rows to ride under gb300 lookups).

data_dir: /home/jding/Documents/aisimulate/python/aisimulate/src/aisimulate_core/systems/data/b300_sxm # absolute path -- reuse b300_sxm's perf tables verbatim

gpu:
  fp32_flops: 75000000000000
  mem_bw: 7750000000000
  mem_bw_empirical_scaling_factor: 0.8
  mem_empirical_constant_latency: 0.000003
  mem_capacity: 288400343040
  bfloat16_tc_flops: 2250000000000000
  int8_tc_flops: 153500000000000
  fp8_tc_flops: 4500000000000000
  fp4_tc_flops: 14000000000000000
  power: 1100
  sm_version: 103

node:
  num_gpus_per_node: 72  # override: entire 72-GPU domain treated as scale-up
  inter_node_bw: 100000000000
  intra_node_bw: 900000000000
  pcie_bw: 128000000000
  p2p_latency: 0.00001

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27'
