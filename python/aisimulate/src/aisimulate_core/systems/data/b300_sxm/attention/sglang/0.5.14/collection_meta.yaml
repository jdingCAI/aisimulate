    # 408 planned cases failed by design: bf16-compute prefill on an fp8 KV cache does not exist ("fp8_context_fmha" case).
    # custom driver (bypasses the case generator; stock run_* collector functions), sglang 0.5.14 pip venv without a container, 1x 'NVIDIA B300 SXM6 AC', GPU clocks not locked, collected 2026-10-09. Evidence: benchmarks/evidence/collector/b300-k3x-2026-10/
    status: partial
  generation_attention_perf:
