# Legacy/documentary tier: these tables combine the original 2026-08-17
# replacement campaigns with scoped values-only remeasurements from
# 2026-08-26. Schema version 1 cannot attest multiple collection events for
# one table, so the run details remain documented in PR #1558 rather than in
# unsupported structured fields. The parquet data itself is unchanged.
# 2026-10-09: rows were appended to both tables (K3-2x GQA-fallback profile, see the per-table notes); the sentence above
# "the parquet data itself is unchanged" describes the earlier state.
schema_version: 1
provenance: legacy
runtime:
  framework: sglang
  version: 0.5.14
tables:
